<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <style>
         {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #fff;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Top 10 IT Companies</h1>
    <ul>
        <li>1. Apple</li>
        <li>2. Microsoft</li>
        <li>3. Amazon</li>
        <li>4. Google</li>
        <li>5. IBM</li>
        <li>6. Facebook (Meta)</li>
        <li>7. Intel</li>
        <li>8. Oracle</li>
        <li>9. Samsung</li>
        <li>10. Cisco</li>
    </ul>
</body>
</html>
